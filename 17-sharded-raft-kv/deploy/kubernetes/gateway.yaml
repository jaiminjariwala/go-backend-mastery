apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raft-lab
      component: router
  template:
    metadata:
      labels:
        app: raft-lab
        component: router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: router
          image: raft-kv:lab
          imagePullPolicy: IfNotPresent
          args:
            [
              -mode=router,
              -listen=0.0.0.0:8084,
              -peer-config=/etc/raft/peers.json,
            ]
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: "1", memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          volumeMounts:
            - name: peers
              mountPath: /etc/raft
              readOnly: true
      volumes:
        - name: peers
          configMap:
            name: raft-peers
---
apiVersion: v1
kind: Service
metadata:
  name: raft-router
spec:
  selector: { app: raft-lab, component: router }
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: raft-lab, component: web }
  template:
    metadata:
      labels: { app: raft-lab, component: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          image: raft-web:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: raft-web
spec:
  selector: { app: raft-lab, component: web }
  ports:
    - name: http
      port: 3000
      targetPort: http
