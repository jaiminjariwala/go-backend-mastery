# Cleartext lab traffic stays within these Pods. Enforcement requires a CNI
# implementing NetworkPolicy; kind's default CNI may not enforce this resource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: raft-lab
spec:
  podSelector:
    matchLabels: { app: raft-lab }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: raft-lab }
      ports:
        - { protocol: TCP, port: 8091 }
        - { protocol: TCP, port: 8084 }
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: raft-lab }
      ports:
        - { protocol: TCP, port: 8091 }
        - { protocol: TCP, port: 8084 }
        - { protocol: TCP, port: 3000 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
